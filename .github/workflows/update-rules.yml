name: Weekly Filter Rules Update

on:
  schedule:
    - cron: '0 3 * * 1' # Runs every Monday at 03:00 UTC
  workflow_dispatch:     # Allows manual trigger

permissions:
  contents: write

jobs:
  update-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compile latest EasyList and OISD rules
        run: npm run build:rules

      - name: Validate generated DNR rules and MV3 schema
        run: npm run validate:rules

      - name: Commit and push rule updates if changed
        run: |
          if git diff --quiet rules/ads_trackers.json; then
            echo "No rule changes detected. Skipping commit."
          else
            echo "Changes detected in rules/ads_trackers.json. Committing updates..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add rules/ads_trackers.json
            git commit -m "chore(rules): haftalık EasyList ve OISD kurallarını güncelle"
            git push
          fi
