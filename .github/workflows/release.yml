name: Release Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run check
      - run: npm run build
      - run: npm run pack
      # Same source, same bytes: the published SHA-256 sums can be rebuilt.
      - run: npm run repro
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: AX Privacy ${{ github.ref_name }}
          files: |
            dist/*.zip
            dist/*.cdx.json
            dist/SHA256SUMS
          generate_release_notes: true
